<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="900"
     viewBox="0 0 1600 900">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>

<linearGradient id="green" x1="0" x2="1">
<stop offset="0%" stop-color="#10b981"/>
<stop offset="100%" stop-color="#22c55e"/>
</linearGradient>

<linearGradient id="amber" x1="0" x2="1">
<stop offset="0%" stop-color="#f59e0b"/>
<stop offset="100%" stop-color="#fb923c"/>
</linearGradient>

<linearGradient id="blue" x1="0" x2="1">
<stop offset="0%" stop-color="#2563eb"/>
<stop offset="100%" stop-color="#3b82f6"/>
</linearGradient>

<linearGradient id="purple" x1="0" x2="1">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="100%" stop-color="#8b5cf6"/>
</linearGradient>

<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="8" stdDeviation="12"
 flood-color="#000000"
 flood-opacity="0.35"/>
</filter>

<marker id="arrow"
        markerWidth="12"
        markerHeight="12"
        refX="9"
        refY="6"
        orient="auto">
<path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
</marker>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;display=swap');

.title{
font:700 34px 'DM Sans', sans-serif;
fill:white;
}

.subtitle{
font:500 18px 'DM Sans', sans-serif;
fill:#94a3b8;
}

.cardTitle{
font:700 22px 'DM Sans', sans-serif;
fill:white;
}

.cardText{
font:500 17px 'DM Sans', sans-serif;
fill:#cbd5e1;
}

.small{
font:600 14px 'DM Sans', sans-serif;
fill:#f8fafc;
}

</style>

</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<!-- subtle grid -->

<g opacity=".05">
<path d="M0 100 H1600"/>
<path d="M0 200 H1600"/>
<path d="M0 300 H1600"/>
<path d="M0 400 H1600"/>
<path d="M0 500 H1600"/>
<path d="M0 600 H1600"/>
<path d="M0 700 H1600"/>
<path d="M0 800 H1600"/>

<path d="M200 0 V900"/>
<path d="M400 0 V900"/>
<path d="M600 0 V900"/>
<path d="M800 0 V900"/>
<path d="M1000 0 V900"/>
<path d="M1200 0 V900"/>
<path d="M1400 0 V900"/>
</g>

<text class="title" x="800" y="70" text-anchor="middle">
Hybrid Cognitive Architecture for Renewable Energy Diagnostics
</text>

<text class="subtitle" x="800" y="105" text-anchor="middle">
Fast perception through JEPA • Deliberate reasoning through Retrieval-Augmented Generation
</text>

<!-- telemetry -->

<rect x="80" y="320"
      rx="22"
      width="220"
      height="180"
      fill="#172033"
      stroke="#334155"
      filter="url(#shadow)"/>

<circle cx="190" cy="370" r="28"
fill="#22c55e"/>

<path d="M170 370
L182 355
L194 382
L207 360"
stroke="white"
stroke-width="4"
fill="none"/>

<text class="cardTitle"
x="190"
y="430"
text-anchor="middle">
Telemetry
</text>

<text class="cardText"
x="190"
y="460"
text-anchor="middle">
Continuous asset
</text>

<text class="cardText"
x="190"
y="485"
text-anchor="middle">
sensor streams
</text>

<!-- System 1 -->

<rect x="380"
      y="250"
      width="350"
      height="320"
      rx="26"
      fill="url(#green)"
      filter="url(#shadow)"/>

<text class="cardTitle"
x="555"
y="305"
text-anchor="middle">
System 1
</text>

<text class="small"
x="555"
y="333"
text-anchor="middle">
Ona World Model (JEPA)
</text>

<circle cx="555"
cy="400"
r="56"
fill="rgba(255,255,255,.18)"
opacity=".25"/>

<path d="M520 405
Q555 350 590 405
Q555 460 520 405"
stroke="white"
stroke-width="4"
fill="none"/>

<text class="cardText"
x="555"
y="500"
text-anchor="middle">
Fast forward inference
</text>

<text class="cardText"
x="555"
y="530"
text-anchor="middle">
Physics-conditioned
</text>

<text class="cardText"
x="555"
y="555"
text-anchor="middle">
continuous monitoring
</text>

<!-- Gate -->

<circle
cx="835"
cy="410"
r="52"
fill="url(#amber)"
filter="url(#shadow)"/>

<path d="M835 382
L860 430
H810
Z"
fill="white"/>

<circle cx="835"
cy="420"
r="5"
fill="#f59e0b"/>

<text class="small"
x="835"
y="495"
text-anchor="middle">
Severity /
</text>

<text class="small"
x="835"
y="515"
text-anchor="middle">
Persistence
</text>

<!-- System2 -->

<rect x="980"
      y="170"
      width="500"
      height="500"
      rx="30"
      fill="url(#blue)"
      filter="url(#shadow)"/>

<text class="cardTitle"
x="1230"
y="230"
text-anchor="middle">
System 2
</text>

<text class="small"
x="1230"
y="260"
text-anchor="middle">
Nehanda Reasoner
</text>

<!-- retrieval module -->

<rect
x="1040"
y="305"
width="380"
height="130"
rx="18"
fill="url(#purple)"/>

<text class="cardTitle"
x="1230"
y="350"
text-anchor="middle">
Retrieve Context
</text>

<text class="cardText"
x="1230"
y="382"
text-anchor="middle">
Dense vectors • Sparse search
</text>

<text class="cardText"
x="1230"
y="410"
text-anchor="middle">
Cross-encoder reranking
</text>

<!-- arrow -->

<line
x1="1230"
y1="435"
x2="1230"
y2="480"
stroke="white"
stroke-width="3"
marker-end="url(#arrow)"/>

<!-- reasoning -->

<rect
x="1040"
y="500"
width="380"
height="120"
rx="18"
fill="#1e3a8a"/>

<text class="cardTitle"
x="1230"
y="545"
text-anchor="middle">
Grounded Reasoning
</text>

<text class="cardText"
x="1230"
y="578"
text-anchor="middle">
Evidence-bounded synthesis
</text>

<text class="cardText"
x="1230"
y="603"
text-anchor="middle">
No ungrounded conclusions
</text>

<!-- output -->

<rect
x="1080"
y="735"
width="300"
height="110"
rx="20"
fill="#0f766e"
filter="url(#shadow)"/>

<text class="cardTitle"
x="1230"
y="785"
text-anchor="middle">
Diagnostic Report
</text>

<text class="cardText"
x="1230"
y="815"
text-anchor="middle">
Evidence • Citations • Actions
</text>

<!-- arrows -->

<line
x1="300"
y1="410"
x2="380"
y2="410"
stroke="#94a3b8"
stroke-width="4"
marker-end="url(#arrow)"/>

<line
x1="730"
y1="410"
x2="783"
y2="410"
stroke="#94a3b8"
stroke-width="4"
marker-end="url(#arrow)"/>

<line
x1="887"
y1="410"
x2="980"
y2="410"
stroke="#94a3b8"
stroke-width="4"
marker-end="url(#arrow)"/>

<line
x1="1230"
y1="670"
x2="1230"
y2="735"
stroke="#94a3b8"
stroke-width="4"
marker-end="url(#arrow)"/>

</svg>
