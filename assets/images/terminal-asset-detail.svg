<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#1e293b"/>
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Desert Peak PV Array - Asset Detail</text>
  
  <!-- Back button -->
  <rect x="650" y="15" width="120" height="30" fill="#3b82f6" rx="6"/>
  <text x="665" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="white">← Back to Assets</text>
  
  <!-- Main Content Area -->
  <rect x="20" y="80" width="760" height="500" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Asset Header -->
  <text x="40" y="110" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Desert Peak PV Array</text>
  <text x="40" y="135" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Location: California • Capacity: 50MW • Status: Operational</text>
  
  <!-- Component Monitoring Grid -->
  <rect x="40" y="160" width="350" height="200" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="185" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Component Status</text>
  
  <!-- Inverter -->
  <rect x="60" y="200" width="310" height="50" fill="#fef2f2" rx="6" stroke="#fecaca" stroke-width="1"/>
  <circle cx="75" cy="215" r="8" fill="#ef4444"/>
  <text x="95" y="220" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Inverter #1</text>
  <text x="95" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#dc2626">Fault Detected - Immediate action required</text>
  <text x="320" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#dc2626">80%</text>
  
  <!-- Panels -->
  <rect x="60" y="260" width="310" height="50" fill="#fffbeb" rx="6" stroke="#fed7aa" stroke-width="1"/>
  <circle cx="75" cy="275" r="8" fill="#f59e0b"/>
  <text x="95" y="280" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Solar Panels (300W)</text>
  <text x="95" y="295" font-family="system-ui, sans-serif" font-size="12" fill="#d97706">Soiling loss at 3% - Cleaning recommended</text>
  <text x="320" y="280" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#d97706">5%</text>
  
  <!-- Cabling -->
  <rect x="60" y="320" width="310" height="50" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="75" cy="335" r="8" fill="#10b981"/>
  <text x="95" y="340" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Cabling</text>
  <text x="95" y="355" font-family="system-ui, sans-serif" font-size="12" fill="#059669">Operating normally</text>
  <text x="320" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#059669">0%</text>
  
  <!-- Performance Charts -->
  <rect x="420" y="160" width="340" height="200" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="185" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Performance Analytics</text>
  
  <!-- Output Chart -->
  <rect x="440" y="200" width="300" height="80" fill="#f8fafc" rx="4"/>
  <text x="450" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">24h Power Output (MW)</text>
  
  <!-- Chart line -->
  <path d="M 450 260 L 470 250 L 490 255 L 510 245 L 530 250 L 550 240 L 570 245 L 590 235 L 610 240 L 630 230 L 650 235 L 670 225 L 690 230 L 710 220 L 730 225" stroke="#3b82f6" stroke-width="2" fill="none"/>
  
  <!-- Y-axis labels -->
  <text x="435" y="225" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">50</text>
  <text x="435" y="245" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">40</text>
  <text x="435" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">30</text>
  
  <!-- Efficiency Gauge -->
  <rect x="440" y="300" width="140" height="40" fill="#f1f5f9" rx="6"/>
  <text x="450" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Efficiency</text>
  <text x="450" y="330" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">73%</text>
  
  <!-- Revenue -->
  <rect x="600" y="300" width="140" height="40" fill="#f1f5f9" rx="6"/>
  <text x="610" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Revenue (24h)</text>
  <text x="610" y="330" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">$8.2K</text>
  
  <!-- Maintenance Plan -->
  <rect x="40" y="380" width="350" height="180" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Maintenance Plan</text>
  
  <!-- Priority items -->
  <rect x="60" y="420" width="310" height="40" fill="#fef2f2" rx="6" stroke="#fecaca" stroke-width="1"/>
  <circle cx="75" cy="435" r="8" fill="#ef4444"/>
  <text x="95" y="440" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#dc2626">High Priority</text>
  <text x="95" y="455" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Inverter replacement - Fault detected</text>
  
  <rect x="60" y="470" width="310" height="40" fill="#fffbeb" rx="6" stroke="#fed7aa" stroke-width="1"/>
  <circle cx="75" cy="485" r="8" fill="#f59e0b"/>
  <text x="95" y="490" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#d97706">Medium Priority</text>
  <text x="95" y="505" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Panel cleaning - Soiling affecting output</text>
  
  <rect x="60" y="520" width="310" height="40" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="75" cy="535" r="8" fill="#059669"/>
  <text x="95" y="540" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#059669">Low Priority</text>
  <text x="95" y="555" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Routine inspection - Scheduled for next week</text>
  
  <!-- Quick Actions -->
  <rect x="420" y="380" width="340" height="180" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="405" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Quick Actions</text>
  
  <!-- Action buttons -->
  <rect x="440" y="420" width="140" height="40" fill="#3b82f6" rx="6"/>
  <text x="470" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="white">Create Work Order</text>
  
  <rect x="600" y="420" width="140" height="40" fill="#10b981" rx="6"/>
  <text x="610" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="white">Schedule Maintenance</text>
  
  <rect x="440" y="470" width="140" height="40" fill="#f59e0b" rx="6"/>
  <text x="470" y="495" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="white">Generate Report</text>
  
  <rect x="600" y="470" width="140" height="40" fill="#8b5cf6" rx="6"/>
  <text x="630" y="495" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="white">Contact Support</text>
  
  <!-- AI Assistant -->
  <rect x="440" y="520" width="300" height="30" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="540" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">💬 Ask Ona Assistant about this asset...</text>
</svg>
