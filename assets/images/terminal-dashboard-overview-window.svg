<svg width="800" height="640" viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ona Terminal Dashboard with window chrome and rounded corners">
  <defs>
    <clipPath id="window-clip">
      <rect x="0" y="0" width="800" height="640" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Outer rounded background -->
  <rect x="0" y="0" width="800" height="640" rx="16" fill="#ffffff"/>

  <!-- All window contents clipped to rounded corners -->
  <g clip-path="url(#window-clip)">
    <!-- Window chrome top bar -->
    <rect x="0" y="0" width="800" height="40" fill="#e5e7eb"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="20" r="6" fill="#28c840"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Existing artwork shifted down to accommodate the top bar -->
    <g transform="translate(0, 40)">
      <!-- Background -->
      <rect width="800" height="600" fill="#f8fafc"/>

      <!-- Header -->
      <rect x="0" y="0" width="800" height="60" fill="#1e293b"/>
      <text x="20" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Ona Terminal Dashboard</text>

      <!-- Navigation -->
      <rect x="0" y="60" width="200" height="540" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">Asset List</text>
      <text x="20" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">Today's Plan</text>
      <text x="20" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">Performance</text>

      <!-- Main Content Area -->
      <rect x="220" y="80" width="560" height="500" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Asset Cards -->
      <!-- Sunrise Valley Solar Farm -->
      <rect x="240" y="100" width="260" height="140" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
      <text x="260" y="125" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Sunrise Valley Solar Farm</text>

      <!-- Status indicators -->
      <circle cx="270" cy="145" r="6" fill="#10b981"/>
      <text x="285" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Inverter: 10% output</text>

      <circle cx="270" cy="165" r="6" fill="#10b981"/>
      <text x="285" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Cabling: Stable</text>

      <circle cx="270" cy="185" r="6" fill="#10b981"/>
      <text x="285" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Data Logger: OK</text>

      <!-- Performance chart -->
      <rect x="260" y="210" width="220" height="4" fill="#e2e8f0" rx="2"/>
      <rect x="260" y="210" width="198" height="4" fill="#10b981" rx="2"/>
      <text x="260" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Performance: 90%</text>

      <!-- Desert Peak PV Array -->
      <rect x="520" y="100" width="260" height="140" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
      <text x="540" y="125" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Desert Peak PV Array</text>

      <!-- Status indicators -->
      <circle cx="550" cy="145" r="6" fill="#ef4444"/>
      <text x="565" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Inverter: Fault detected</text>

      <circle cx="550" cy="165" r="6" fill="#f59e0b"/>
      <text x="565" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Panels: Soiling loss</text>

      <circle cx="550" cy="185" r="6" fill="#10b981"/>
      <text x="565" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Cabling: Stable</text>

      <!-- Performance chart -->
      <rect x="540" y="210" width="220" height="4" fill="#e2e8f0" rx="2"/>
      <rect x="540" y="210" width="110" height="4" fill="#ef4444" rx="2"/>
      <text x="540" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Performance: 50%</text>

      <!-- Today's Plan Section -->
      <rect x="240" y="260" width="540" height="140" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
      <text x="260" y="285" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Today's Maintenance Plan</text>

      <!-- Plan items -->
      <rect x="260" y="295" width="8" height="8" fill="#ef4444" rx="2"/>
      <text x="275" y="303" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Inverter replacement - Desert Peak (Priority: High)</text>

      <rect x="260" y="320" width="8" height="8" fill="#f59e0b" rx="2"/>
      <text x="275" y="328" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Panel cleaning - Desert Peak (Priority: Medium)</text>

      <rect x="260" y="345" width="8" height="8" fill="#10b981" rx="2"/>
      <text x="275" y="353" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Routine inspection - Sunrise Valley (Priority: Low)</text>

      <!-- Performance Metrics -->
      <rect x="240" y="420" width="540" height="140" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
      <text x="260" y="445" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Performance Overview</text>

      <!-- Metric cards -->
      <rect x="260" y="455" width="120" height="60" fill="#f1f5f9" rx="6"/>
      <text x="270" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Total Output</text>
      <text x="270" y="495" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">2.4 MW</text>

      <rect x="400" y="455" width="120" height="60" fill="#f1f5f9" rx="6"/>
      <text x="410" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Efficiency</text>
      <text x="410" y="495" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">87%</text>

      <rect x="540" y="455" width="120" height="60" fill="#f1f5f9" rx="6"/>
      <text x="550" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Revenue</text>
      <text x="550" y="495" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">$12.4K</text>

      <rect x="680" y="455" width="80" height="60" fill="#f1f5f9" rx="6"/>
      <text x="690" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Alerts</text>
      <text x="690" y="495" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ef4444">3</text>

      <!-- Chart area -->
      <rect x="260" y="525" width="500" height="20" fill="#f8fafc" rx="4"/>
      <text x="270" y="540" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">24h Performance Trend</text>
    </g>
  </g>

  <!-- Subtle border to emphasize rounded corners -->
  <rect x="0.5" y="0.5" width="799" height="639" rx="16" ry="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>
</svg>
