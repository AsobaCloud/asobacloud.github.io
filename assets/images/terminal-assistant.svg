<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#1e293b"/>
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Ona Assistant</text>
  
  <!-- Main Chat Area -->
  <rect x="20" y="80" width="760" height="480" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Chat Header -->
  <rect x="20" y="80" width="760" height="50" fill="#f8fafc" rx="8"/>
  <text x="40" y="105" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">💬 O&amp;M Assistant</text>
  <text x="40" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">How can I help you today?</text>
  
  <!-- Chat Messages -->
  <!-- User Message -->
  <rect x="40" y="150" width="300" height="60" fill="#3b82f6" rx="12"/>
  <text x="60" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="white">What's causing the inverter fault at Desert Peak?</text>
  <text x="60" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#bfdbfe">Just now</text>
  
  <!-- Assistant Response -->
  <rect x="360" y="230" width="380" height="120" fill="#f1f5f9" rx="12"/>
  <text x="380" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Based on the diagnostic data, the inverter fault is likely caused by:</text>
  <text x="380" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• DC combiner degradation (80% probability)</text>
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Voltage fluctuations from grid instability</text>
  <text x="380" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Thermal stress from recent heat wave</text>
  <text x="380" y="320" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Recommended action: Replace DC combiner within 48 hours.</text>
  <text x="380" y="340" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">2 minutes ago</text>
  
  <!-- User Message -->
  <rect x="40" y="370" width="280" height="50" fill="#3b82f6" rx="12"/>
  <text x="60" y="390" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="white">How much will this cost and how long will it take?</text>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="11" fill="#bfdbfe">1 minute ago</text>
  
  <!-- Assistant Response -->
  <rect x="340" y="440" width="400" height="80" fill="#f1f5f9" rx="12"/>
  <text x="360" y="460" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Cost breakdown:</text>
  <text x="360" y="475" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• DC Combiner: $1,500</text>
  <text x="360" y="490" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Labor (2 technicians): $800</text>
  <text x="360" y="505" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Total: $2,300</text>
  <text x="360" y="520" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Timeline: 4-6 hours installation, can be done tomorrow.</text>
  
  <!-- Input Area -->
  <rect x="20" y="540" width="760" height="20" fill="#f8fafc"/>
  
  <!-- Message Input -->
  <rect x="40" y="570" width="640" height="40" fill="#ffffff" rx="20" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="595" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af">Type your message...</text>
  
  <!-- Send Button -->
  <rect x="700" y="570" width="60" height="40" fill="#3b82f6" rx="20"/>
  <text x="720" y="595" font-family="system-ui, sans-serif" font-size="16" fill="white">→</text>
  
  <!-- Quick Actions -->
  <rect x="40" y="620" width="720" height="60" fill="#f8fafc" rx="8"/>
  <text x="60" y="640" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Quick Actions:</text>
  
  <!-- Quick action buttons -->
  <rect x="60" y="650" width="120" height="20" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="665" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Create Work Order</text>
  
  <rect x="190" y="650" width="100" height="20" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="665" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Schedule Repair</text>
  
  <rect x="300" y="650" width="80" height="20" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1"/>
  <text x="310" y="665" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Get Quote</text>
  
  <rect x="390" y="650" width="100" height="20" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="665" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">View History</text>
  
  <!-- AI Status Indicator -->
  <circle cx="750" cy="100" r="8" fill="#10b981"/>
  <text x="760" y="105" font-family="system-ui, sans-serif" font-size="10" fill="#059669">AI</text>
</svg>
