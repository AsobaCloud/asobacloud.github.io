<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Browser window background -->
  <rect width="400" height="250" fill="#ffffff" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Browser header -->
  <rect width="400" height="40" fill="#f5f5f5" rx="8"/>
  <rect y="40" width="400" height="210" fill="#ffffff"/>
  
  <!-- Browser controls -->
  <circle cx="15" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="35" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="55" cy="20" r="6" fill="#28ca42"/>
  
  <!-- Address bar -->
  <rect x="80" y="12" width="250" height="16" fill="#ffffff" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="85" y="22" fill="#666666" font-family="Arial, sans-serif" font-size="10">app.asoba.co</text>
  
  <!-- App header -->
  <rect x="20" y="60" width="360" height="40" fill="#4285f4" rx="4"/>
  <text x="30" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Ona Demand Forecasting</text>
  
  <!-- Dashboard cards -->
  <rect x="30" y="120" width="100" height="60" fill="#f8f9fa" rx="4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="35" y="135" fill="#666666" font-family="Arial, sans-serif" font-size="10">Current Load</text>
  <text x="35" y="155" fill="#1a73e8" font-family="Arial, sans-serif" font-size="18" font-weight="bold">12.4 kW</text>
  
  <rect x="150" y="120" width="100" height="60" fill="#f8f9fa" rx="4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="155" y="135" fill="#666666" font-family="Arial, sans-serif" font-size="10">Next Hour</text>
  <text x="155" y="155" fill="#34a853" font-family="Arial, sans-serif" font-size="18" font-weight="bold">15.1 kW</text>
  
  <rect x="270" y="120" width="100" height="60" fill="#f8f9fa" rx="4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="275" y="135" fill="#666666" font-family="Arial, sans-serif" font-size="10">Peak Today</text>
  <text x="275" y="155" fill="#ea4335" font-family="Arial, sans-serif" font-size="18" font-weight="bold">18.7 kW</text>
  
  <!-- Chart area -->
  <rect x="30" y="200" width="340" height="30" fill="#f8f9fa" rx="2" stroke="#e0e0e0" stroke-width="1"/>
  <text x="35" y="220" fill="#666666" font-family="Arial, sans-serif" font-size="12">24-Hour Forecast Chart</text>
</svg>