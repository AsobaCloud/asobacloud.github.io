<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e293b" text-anchor="middle">Optimized State: Unified Data Processing</text>
  <text x="400" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Ona Terminal / eSUMS Solution</text>
  
  <!-- Solar Systems -->
  <!-- Solar System 1 -->
  <polygon points="90,100 70,120 110,120" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Solar System 1</text>
  
  <!-- Solar System 2 -->
  <polygon points="290,100 270,120 310,120" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="290" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Solar System 2</text>
  
  <!-- Data Sources -->
  <!-- Huawei -->
  <rect x="50" y="160" width="80" height="40" fill="#e2e8f0" rx="6"/>
  <text x="90" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Huawei</text>
  
  <!-- SolarEdge -->
  <rect x="250" y="160" width="80" height="40" fill="#e2e8f0" rx="6"/>
  <text x="290" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">SolarEdge</text>
  
  <!-- Data Upload Arrows -->
  <path d="M 90 120 L 90 160" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="110" y="145" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">Data upload</text>
  
  <path d="M 290 120 L 290 160" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="145" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">Data upload</text>
  
  <!-- On Site Cloud -->
  <ellipse cx="400" cy="250" rx="80" ry="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="255" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">On Site Cloud</text>
  
  <!-- Arrows to Cloud - Fixed to avoid overlapping boxes -->
  <path d="M 130 180 L 320 250" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 270 180 L 320 250" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Ona Terminal / eSUMS -->
  <rect x="250" y="320" width="300" height="120" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Ona Terminal Functions -->
  <rect x="260" y="330" width="140" height="100" fill="#f0fdf4" rx="6" stroke="#10b981" stroke-width="1"/>
  <text x="330" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Ona Terminal</text>
  
  <text x="270" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">• Data Cleaning</text>
  <text x="270" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">• Forecasting</text>
  <text x="270" y="395" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">• Financial Risk Calcs</text>
  <text x="270" y="410" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">• Schedule Maintenance</text>
  <text x="270" y="425" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">Activities</text>
  
  <!-- eSUMS -->
  <rect x="420" y="330" width="120" height="100" fill="#fef3c7" rx="6" stroke="#f59e0b" stroke-width="1"/>
  <text x="480" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">eSUMS</text>
  <text x="480" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Energy System</text>
  <text x="480" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Utility</text>
  <text x="480" y="395" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Management</text>
  <text x="480" y="410" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">System</text>
  
  <!-- Arrow from Cloud to Terminal -->
  <path d="M 400 285 L 400 320" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Ops Lead - Replaced emoji with SVG person icon -->
  <circle cx="650" cy="400" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <!-- Person icon using SVG shapes instead of emoji -->
  <circle cx="650" cy="395" r="6" fill="#6b7280"/>
  <path d="M 640 405 Q 650 415 660 405" stroke="#6b7280" stroke-width="2" fill="none"/>
  <text x="650" y="430" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Ops Lead</text>
  
  <!-- Automated Alerts Arrow - Fixed positioning -->
  <path d="M 550 380 L 630 400" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="570" y="385" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">Send Automated Alerts</text>
  <text x="570" y="395" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">to Approve Schedule</text>
  
  <!-- Natural Language Query Arrow - Fixed positioning to avoid text overlap -->
  <path d="M 630 420 L 550 440" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="580" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">Can use natural language</text>
  <text x="580" y="445" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">queries to troubleshoot</text>
  <text x="580" y="455" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">known issues</text>
  
  <!-- Benefits Box -->
  <rect x="50" y="480" width="700" height="100" fill="#f0fdf4" rx="8" stroke="#10b981" stroke-width="1"/>
  <text x="400" y="500" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">Key Benefits</text>
  
  <text x="100" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">• Unified data processing from all sources</text>
  <text x="100" y="535" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">• Automated alerts and scheduling</text>
  <text x="100" y="550" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">• Natural language troubleshooting</text>
  
  <text x="450" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">• Predictive maintenance optimization</text>
  <text x="450" y="535" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">• Financial risk calculations</text>
  <text x="450" y="550" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">• Proactive issue resolution</text>
  
  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
