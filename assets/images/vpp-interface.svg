<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid background -->
  <rect x="10" y="10" width="40" height="40" rx="4" fill="#f0f4ff" stroke="#455bf1" stroke-width="2"/>
  
  <!-- Power lines -->
  <line x1="15" y1="20" x2="45" y2="20" stroke="#455bf1" stroke-width="2"/>
  <line x1="15" y1="30" x2="45" y2="30" stroke="#455bf1" stroke-width="2"/>
  <line x1="15" y1="40" x2="45" y2="40" stroke="#455bf1" stroke-width="2"/>
  
  <!-- Power nodes -->
  <circle cx="20" cy="20" r="3" fill="#455bf1"/>
  <circle cx="30" cy="20" r="3" fill="#455bf1"/>
  <circle cx="40" cy="20" r="3" fill="#455bf1"/>
  
  <circle cx="20" cy="30" r="3" fill="#455bf1"/>
  <circle cx="30" cy="30" r="3" fill="#455bf1"/>
  <circle cx="40" cy="30" r="3" fill="#455bf1"/>
  
  <circle cx="20" cy="40" r="3" fill="#455bf1"/>
  <circle cx="30" cy="40" r="3" fill="#455bf1"/>
  <circle cx="40" cy="40" r="3" fill="#455bf1"/>
  
  <!-- Energy flow arrows -->
  <path d="M25 15 L35 15" stroke="#3748c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M25 25 L35 25" stroke="#3748c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M25 35 L35 35" stroke="#3748c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#3748c8"/>
    </marker>
  </defs>
</svg>
