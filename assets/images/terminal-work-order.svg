<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#1e293b"/>
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Work Order Management</text>
  
  <!-- Main Content Area -->
  <rect x="20" y="80" width="760" height="500" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Modal Header -->
  <text x="40" y="110" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e293b">Add to Work Order: Inverter</text>
  <text x="40" y="135" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Desert Peak PV Array • Fault detected - Immediate action required</text>
  
  <!-- Component Selection -->
  <rect x="40" y="160" width="350" height="120" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="185" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Component Details</text>
  
  <!-- Component info -->
  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#1e293b">Component: Inverter #1</text>
  <text x="60" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#1e293b">Serial: INV-2024-001</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b">Issue: Fault detected - 80% failure probability</text>
  <text x="60" y="270" font-family="system-ui, sans-serif" font-size="14" fill="#1e293b">Priority: High</text>
  
  <!-- SKU Catalog -->
  <rect x="420" y="160" width="340" height="300" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="185" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Available Parts</text>
  
  <!-- SKU Option 1 - Recommended -->
  <rect x="440" y="200" width="300" height="80" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="2"/>
  <text x="460" y="220" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#059669">SKU-INV-001: Standard Inverter</text>
  <text x="460" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#059669">Replacement</text>
  <text x="460" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Qty: 1 • Price: $1,500 • Lead Time: 3-5 days</text>
  <text x="460" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#059669">✓ Recommended for this fault type</text>
  <rect x="700" y="210" width="20" height="20" fill="#10b981" rx="10"/>
  <text x="705" y="225" font-family="system-ui, sans-serif" font-size="12" fill="white">✓</text>
  
  <!-- SKU Option 2 -->
  <rect x="440" y="290" width="300" height="60" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="460" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">SKU-INV-002: Premium Inverter Upgrade</text>
  <text x="460" y="330" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Qty: 1 • Price: $2,500 • Lead Time: 7-10 days</text>
  <rect x="700" y="310" width="20" height="20" fill="#ffffff" rx="10" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- SKU Option 3 -->
  <rect x="440" y="360" width="300" height="60" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="460" y="380" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">SKU-INV-003: Refurbished Inverter</text>
  <text x="460" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Qty: 1 • Price: $1,000 • Lead Time: 5-7 days</text>
  <rect x="700" y="380" width="20" height="20" fill="#ffffff" rx="10" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Work Order Options -->
  <rect x="40" y="300" width="350" height="160" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="325" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Work Order Options</text>
  
  <!-- Add to existing -->
  <rect x="60" y="340" width="310" height="50" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="75" y="360" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Add to Existing Work Order</text>
  <text x="75" y="375" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">WO-2024-001: Desert Peak Maintenance (3 items)</text>
  <rect x="340" y="350" width="20" height="20" fill="#3b82f6" rx="10"/>
  <text x="345" y="365" font-family="system-ui, sans-serif" font-size="12" fill="white">✓</text>
  
  <!-- Create new -->
  <rect x="60" y="400" width="310" height="40" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="75" y="420" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Create New Work Order</text>
  <rect x="340" y="410" width="20" height="20" fill="#ffffff" rx="10" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Action Buttons -->
  <rect x="40" y="480" width="720" height="80" fill="#f8fafc" rx="8"/>
  
  <!-- Cancel button -->
  <rect x="60" y="500" width="100" height="40" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="85" y="525" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">Cancel</text>
  
  <!-- Add to Work Order button -->
  <rect x="180" y="500" width="160" height="40" fill="#3b82f6" rx="6"/>
  <text x="200" y="525" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">Add to Work Order</text>
  
  <!-- Create New Work Order button -->
  <rect x="360" y="500" width="180" height="40" fill="#10b981" rx="6"/>
  <text x="380" y="525" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">Create New Work Order</text>
  
  <!-- Summary -->
  <rect x="560" y="500" width="180" height="40" fill="#f1f5f9" rx="6"/>
  <text x="570" y="515" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Total: $1,500</text>
  <text x="570" y="530" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Lead Time: 3-5 days</text>
  
  <!-- Status indicator -->
  <rect x="40" y="160" width="4" height="120" fill="#ef4444"/>
</svg>
