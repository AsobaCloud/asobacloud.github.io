<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal background with purple gradient -->
  <defs>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1c4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b3d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" fill="url(#terminalBg)" rx="8"/>
  
  <!-- Main terminal window with cyan border -->
  <rect x="15" y="30" width="370" height="180" fill="none" stroke="#00bcd4" stroke-width="2" rx="4"/>
  
  <!-- Header with robot icon and title -->
  <text x="30" y="50" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Ona Terminal</text>
 
  <!-- Instructions -->
  <text x="30" y="70" fill="#cccccc" font-family="monospace" font-size="11">Type your questions or commands naturally:</text>
  <text x="35" y="85" fill="#888888" font-family="monospace" font-size="10">• 'summarize the pdf located in C:\users\admin\Documents\Tech'</text>
  <text x="35" y="100" fill="#888888" font-family="monospace" font-size="10">• 'show status' or 'list servers'</text>
  <text x="35" y="115" fill="#888888" font-family="monospace" font-size="10">• 'help' for assistance</text>
  
  <text x="30" y="145" fill="#cccccc" font-family="monospace" font-size="11">Current working directory: /home/ubuntu </text>
  
  <!-- Exit instruction -->
  <text x="30" y="170" fill="#d4af37" font-family="monospace" font-size="11">Use 'exit' or Ctrl+C to quit</text>
  
  <!-- Bottom status bar with robot icon -->
  <rect x="0" y="220" width="400" height="30" fill="#2d1b3d"/>
  <text x="15" y="240" fill="#00bcd4" font-family="monospace" font-size="12">🤖</text>
  <rect x="35" y="232" width="12" height="16" fill="#00ff00" rx="2"/>
</svg>