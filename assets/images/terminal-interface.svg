<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal window background -->
  <rect x="10" y="10" width="100" height="60" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  
  <!-- Terminal window header -->
  <rect x="10" y="10" width="100" height="20" rx="4" fill="#2a2a2a"/>
  
  <!-- Window control buttons -->
  <circle cx="25" cy="20" r="4" fill="#ff5f56"/>
  <circle cx="35" cy="20" r="4" fill="#ffbd2e"/>
  <circle cx="45" cy="20" r="4" fill="#27ca3f"/>
  
  <!-- Terminal prompt -->
  <text x="15" y="40" font-family="monospace" font-size="12" fill="#00ff00">$</text>
  <text x="25" y="40" font-family="monospace" font-size="12" fill="#ffffff">ona</text>
  
  <!-- Command output -->
  <text x="15" y="55" font-family="monospace" font-size="10" fill="#888888">Ona Terminal v1.0</text>
  <text x="15" y="68" font-family="monospace" font-size="10" fill="#888888">Ready for commands...</text>
</svg>
