<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background-color: #ffffff;">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Passive Capital vs Risk-Bearing Participation</text>
  
  <!-- Left Panel: Passive Liquidity -->
  <rect x="50" y="80" width="320" height="380" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="5"/>
  <text x="210" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Passive Liquidity</text>
  
  <!-- Capital -->
  <rect x="150" y="150" width="120" height="60" fill="#fbbf24" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="210" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Capital</text>
  
  <!-- Arrow -->
  <path d="M 210 210 L 210 250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Pool -->
  <rect x="150" y="250" width="120" height="60" fill="#93c5fd" stroke="#1e40af" stroke-width="2" rx="5"/>
  <text x="210" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Pool</text>
  
  <!-- Arrow -->
  <path d="M 210 310 L 210 350" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Fixed yield -->
  <rect x="150" y="350" width="120" height="60" fill="#dbeafe" stroke="#1e40af" stroke-width="2" rx="5"/>
  <text x="210" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Fixed Yield</text>
  
  <!-- Label -->
  <text x="210" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Not supported</text>
  
  <!-- Right Panel: Risk-Bearing Capital -->
  <rect x="430" y="80" width="320" height="380" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="590" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Risk-Bearing Capital</text>
  
  <!-- Capital -->
  <rect x="530" y="150" width="120" height="60" fill="#fbbf24" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="590" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Capital</text>
  
  <!-- Arrow -->
  <path d="M 590 210 L 590 250" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
  
  <!-- Specific commitment -->
  <rect x="530" y="250" width="120" height="60" fill="#86efac" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="590" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Specific</text>
  <text x="590" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Commitment</text>
  
  <!-- Outcomes branch -->
  <path d="M 590 310 L 520 350" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <path d="M 590 310 L 660 350" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  
  <!-- Success -->
  <rect x="480" y="350" width="80" height="60" fill="#d1fae5" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="520" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Success</text>
  <text x="520" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Variable</text>
  <text x="520" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">compensation</text>
  
  <!-- Failure -->
  <rect x="600" y="350" width="80" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="5"/>
  <text x="640" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Failure</text>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Slashing</text>
  
  <!-- Label -->
  <text x="590" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Underwriting, not speculation</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
