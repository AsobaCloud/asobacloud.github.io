<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background-color: #ffffff;">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Collateral Sets Maximum Commitment Capacity</text>
  
  <!-- Axes -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="400" x2="100" y2="100" stroke="#000" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Time</text>
  <text x="50" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" transform="rotate(-90, 50, 250)">Active Commitments</text>
  
  <!-- Capacity before treasury participation -->
  <line x1="100" y1="250" x2="700" y2="250" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="720" y="255" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">Capacity before treasury participation</text>
  
  <!-- Capacity after treasury locks collateral -->
  <line x1="100" y1="150" x2="700" y2="150" stroke="#16a34a" stroke-width="3"/>
  <text x="720" y="155" font-family="Arial, sans-serif" font-size="12" fill="#166534">Capacity after treasury locks collateral</text>
  
  <!-- Commitments approaching ceiling -->
  <path d="M 100 400 Q 200 380 300 350 Q 400 300 500 280 Q 600 260 700 250" stroke="#3b82f6" stroke-width="3" fill="none"/>
  
  <!-- Points on the curve -->
  <circle cx="200" cy="380" r="5" fill="#3b82f6"/>
  <circle cx="400" cy="300" r="5" fill="#3b82f6"/>
  <circle cx="600" cy="260" r="5" fill="#3b82f6"/>
  <circle cx="700" cy="250" r="5" fill="#3b82f6"/>
  
  <!-- Label for commitments -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">Commitments approach but do not exceed ceiling</text>
  
  <!-- Arrow showing capacity increase -->
  <path d="M 750 250 L 750 150" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="780" y="200" font-family="Arial, sans-serif" font-size="11" fill="#166534">Treasury</text>
  <text x="780" y="215" font-family="Arial, sans-serif" font-size="11" fill="#166534">participation</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
