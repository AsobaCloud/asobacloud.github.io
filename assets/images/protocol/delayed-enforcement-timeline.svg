<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #ffffff;">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Delayed Enforcement Causes Systemic Risk</text>
  
  <!-- Horizontal axis: Time -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="#000" stroke-width="2"/>
  
  <!-- Time markers -->
  <line x1="150" y1="295" x2="150" y2="305" stroke="#000" stroke-width="2"/>
  <text x="150" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">TÄ</text>
  <text x="150" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Commitment</text>
  <text x="150" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">made</text>
  
  <line x1="400" y1="295" x2="400" y2="305" stroke="#000" stroke-width="2"/>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">TÅ</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Performance</text>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">deviation</text>
  
  <line x1="650" y1="295" x2="650" y2="305" stroke="#000" stroke-width="2"/>
  <text x="650" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">TÇ</text>
  <text x="650" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Enforcement /</text>
  <text x="650" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">penalty applied</text>
  
  <!-- Shaded area between TÅ and TÇ -->
  <rect x="400" y="100" width="250" height="200" fill="#fee2e2" opacity="0.5"/>
  
  <!-- Upward-sloping curve: Cost of being wrong increases with time -->
  <path d="M 150 250 Q 275 200 400 150 Q 525 100 650 50" stroke="#dc2626" stroke-width="3" fill="none"/>
  
  <!-- Labels -->
  <text x="525" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Uncontained risk</text>
  <text x="525" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">&amp; grid impact</text>
  
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#991b1b">Cost of being wrong increases with time</text>
  
  <!-- Arrow showing delay -->
  <path d="M 400 280 L 650 280" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="525" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">Delay period</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
