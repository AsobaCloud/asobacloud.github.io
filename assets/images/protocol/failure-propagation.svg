<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background-color: #ffffff;">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Failure Propagation With vs Without Collateral</text>
  
  <!-- Left Panel: No Collateral -->
  <rect x="50" y="80" width="320" height="380" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="5"/>
  <text x="210" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">No Collateral</text>
  
  <!-- Failure node -->
  <circle cx="210" cy="200" r="50" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <text x="210" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Failure</text>
  
  <!-- Arrows spreading outward -->
  <path d="M 210 250 L 150 320" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)"/>
  <rect x="100" y="320" width="100" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="150" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Grid</text>
  
  <path d="M 210 250 L 210 320" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)"/>
  <rect x="160" y="320" width="100" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="210" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Municipality</text>
  
  <path d="M 210 250 L 270 320" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)"/>
  <rect x="220" y="320" width="100" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="270" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Counterparties</text>
  
  <text x="210" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#991b1b">Penalties and instability propagate outward</text>
  
  <!-- Right Panel: Collateralized -->
  <rect x="430" y="80" width="320" height="380" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="590" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Collateralized</text>
  
  <!-- Failure node -->
  <circle cx="590" cy="200" r="50" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <text x="590" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Failure</text>
  
  <!-- Arrow absorbed into collateral pool -->
  <path d="M 590 250 L 590 320" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrowhead-green)"/>
  
  <!-- Collateral Pool -->
  <rect x="520" y="320" width="140" height="60" fill="#86efac" stroke="#16a34a" stroke-width="3" rx="5"/>
  <text x="590" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Collateral Pool</text>
  <text x="590" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Loss absorbed</text>
  
  <!-- No outward propagation -->
  <text x="590" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#166534">Loss absorbed locally, no propagation</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
