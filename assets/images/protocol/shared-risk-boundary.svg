<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background-color: #ffffff;">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Private Optimization vs Shared-Risk Commitments</text>
  
  <!-- Left Column: Private Optimizations -->
  <rect x="50" y="80" width="320" height="380" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="210" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Private Optimizations</text>
  
  <!-- Examples -->
  <rect x="80" y="150" width="260" height="40" fill="#d1fae5" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="210" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Self-consumption</text>
  <text x="210" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Internal energy use</text>
  
  <rect x="80" y="210" width="260" height="40" fill="#d1fae5" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="210" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Internal Dispatch</text>
  <text x="210" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Private optimization</text>
  
  <rect x="80" y="270" width="260" height="40" fill="#d1fae5" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="210" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Local Load Management</text>
  <text x="210" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Behind-the-meter only</text>
  
  <text x="210" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#166534">Failure only affects operator</text>
  
  <!-- Right Column: Shared-Risk Commitments -->
  <rect x="430" y="80" width="320" height="380" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="5"/>
  <text x="590" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Shared-Risk Commitments</text>
  
  <!-- Examples -->
  <rect x="460" y="150" width="260" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="590" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">VPP Guarantees</text>
  <text x="590" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Virtual power plant availability</text>
  
  <rect x="460" y="210" width="260" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="590" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Grid-Sensitive Dispatch</text>
  <text x="590" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Municipal SLAs</text>
  
  <rect x="460" y="270" width="260" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="590" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Performance-Backed Financing</text>
  <text x="590" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Counterparty risk</text>
  
  <text x="590" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#991b1b">Failure imposes costs on municipalities or counterparties</text>
  
  <!-- Thick vertical line -->
  <line x1="400" y1="80" x2="400" y2="460" stroke="#000" stroke-width="4"/>
</svg>
