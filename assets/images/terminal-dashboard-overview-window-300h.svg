<svg width="530" height="300" viewBox="0 0 530 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ona Terminal Dashboard (cropped to 300px height, 530px wide) with window chrome and rounded corners">
  <defs>
    <clipPath id="window-clip">
      <rect x="0" y="0" width="530" height="300" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Outer rounded background -->
  <rect x="0" y="0" width="530" height="300" rx="16" fill="#ffffff"/>

  <!-- All window contents clipped to rounded corners -->
  <g clip-path="url(#window-clip)">
    <!-- Window chrome top bar -->
    <rect x="0" y="0" width="530" height="40" fill="#e5e7eb"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="20" r="6" fill="#28c840"/>
    <line x1="0" y1="40" x2="530" y2="40" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Existing artwork shifted down to accommodate the top bar -->
    <g transform="translate(0, 40)">
      <!-- Background (trimmed to avoid cutting) -->
      <rect width="530" height="260" fill="#f8fafc"/>

      <!-- Header -->
      <rect x="0" y="0" width="530" height="60" fill="#1e293b"/>
      <text x="20" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Ona Terminal Dashboard</text>


      <!-- Main Content Area (trimmed to avoid cutting) -->
      <rect x="20" y="80" width="490" height="180" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Asset Cards -->
      <!-- Sunrise Valley Solar Farm -->
      <rect x="20" y="100" width="235" height="140" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
      <text x="40" y="125" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Sunrise Valley Solar Farm</text>

      <!-- Status indicators -->
      <circle cx="40" cy="145" r="6" fill="#10b981"/>
      <text x="55" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Inverter: 10% output</text>

      <circle cx="40" cy="165" r="6" fill="#10b981"/>
      <text x="55" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Cabling: Stable</text>

      <circle cx="40" cy="185" r="6" fill="#10b981"/>
      <text x="55" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Data Logger: OK</text>

      <!-- Performance chart -->
      <rect x="40" y="210" width="195" height="4" fill="#e2e8f0" rx="2"/>
      <rect x="40" y="210" width="176" height="4" fill="#10b981" rx="2"/>
      <text x="40" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Performance: 90%</text>

      <!-- Desert Peak PV Array -->
      <rect x="275" y="100" width="235" height="140" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
      <text x="295" y="125" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Desert Peak PV Array</text>

      <!-- Status indicators -->
      <circle cx="295" cy="145" r="6" fill="#ef4444"/>
      <text x="310" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Inverter: Fault detected</text>

      <circle cx="295" cy="165" r="6" fill="#f59e0b"/>
      <text x="310" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Panels: Soiling loss</text>

      <circle cx="295" cy="185" r="6" fill="#10b981"/>
      <text x="310" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Cabling: Stable</text>

      <!-- Performance chart -->
      <rect x="295" y="210" width="195" height="4" fill="#e2e8f0" rx="2"/>
      <rect x="295" y="210" width="98" height="4" fill="#ef4444" rx="2"/>
      <text x="295" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Performance: 50%</text>

      <!-- Note: "Today's Plan" and any content below y=260 are intentionally outside the 300px crop -->
    </g>
  </g>

  <!-- Subtle border to emphasize rounded corners -->
  <rect x="0.5" y="0.5" width="529" height="299" rx="16" ry="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>
</svg>
