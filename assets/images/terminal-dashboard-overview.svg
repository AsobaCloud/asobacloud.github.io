  <!-- Simple chart line -->
  <path d="M 270 540 L 320 520 L 370 530 L 420 515 L 470 525 L 520 510 L 570 520 L 620 505 L 670 515 L 720 500" stroke="#3b82f6" stroke-width="2" fill="none"/>
